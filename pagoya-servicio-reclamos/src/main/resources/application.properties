# Configuración del servidor y Eureka
spring.application.name=pagoya-servicio-reclamos
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración de base de datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/pagoyadb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true